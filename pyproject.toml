[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-gui-wrapper"
version = "0.1.0"
description = "Local desktop control center for LeRobot workflows, diagnostics, run history, and recovery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
authors = [
  { name = "Matthew Woodcock" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/matthewwoodc0/lerobot-gui-wrapper"
Issues = "https://github.com/matthewwoodc0/lerobot-gui-wrapper/issues"

[project.optional-dependencies]
qt = [
  "PySide6>=6.8",
]
media = [
  "opencv-python-headless>=4.10",
]
gui = [
  "PySide6>=6.8",
  "opencv-python-headless>=4.10",
]
dev = [
  "mypy>=1.10",
  "numpy>=1.26",
  "packaging>=24.0",
  "Pillow>=10.0",
  "PySide6>=6.8",
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pyyaml>=6.0",
  "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = ["robot_pipeline"]

[tool.setuptools.packages.find]
include = ["robot_pipeline_app*"]

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
